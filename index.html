<main class="container">


<h2>
最新情報
</h2>

<p class="infoIntro">
頭文字D・MFゴースト・昴と彗星のグッズやコラボ情報などを、Xの投稿から厳選してまとめています。気になる情報があれば、元記事のリンクから詳細をチェックしてみてください。
</p>

<p class="infoMetaRow">
    <span id="lastUpdated" class="lastUpdated"></span>
    <a class="rssLink" href="feed.xml" target="_blank" rel="noopener noreferrer">📡 RSSで購読</a>
</p>

<div class="infoControls" id="infoControls">

    <div class="infoControlRow infoSearchRow">
        <input
            type="search"
            id="infoSearchInput"
            class="infoSearchInput"
            placeholder="キーワードで検索（例：ポップアップ、AE86）"
            aria-label="最新情報をキーワードで検索"
            role="combobox"
            aria-expanded="false"
            aria-controls="infoSearchSuggestions"
            aria-autocomplete="list"
            autocomplete="off">
        <ul
            id="infoSearchSuggestions"
            class="infoSearchSuggestions"
            role="listbox"
            aria-label="検索候補"
            hidden>
        </ul>
    </div>

    <button
        type="button"
        id="infoFilterToggle"
        class="infoFilterToggle"
        aria-expanded="false"
        aria-controls="infoFilterPanel">
        🔍 絞り込み・並び替え <span class="infoFilterToggleIcon" aria-hidden="true">▾</span>
    </button>

    <div class="infoFilterPanel" id="infoFilterPanel">

    <div class="infoControlRow infoTagFilters" id="infoTagFilters" aria-label="タグで絞り込み">
    </div>

    <div class="infoControlRow infoSubFilters">

        <div class="infoFilterGroup" role="group" aria-label="並び替え">
            <span class="infoFilterLabel">並び替え：</span>
            <button type="button" class="infoFilterButton is-active" data-sort="new">新着順</button>
            <button type="button" class="infoFilterButton" data-sort="old">古い順</button>
        </div>

        <div class="infoFilterGroup" role="group" aria-label="期間で絞り込み">
            <span class="infoFilterLabel">期間：</span>
            <button type="button" class="infoFilterButton is-active" data-period="all">すべて</button>
            <button type="button" class="infoFilterButton" data-period="week">今週</button>
            <button type="button" class="infoFilterButton" data-period="month">今月</button>
            <button type="button" class="infoFilterButton" data-period="ongoing">開催中のみ</button>
        </div>

        <div class="infoFilterGroup" role="group" aria-label="ステータスで絞り込み">
            <span class="infoFilterLabel">ステータス：</span>
            <button type="button" class="infoFilterButton is-active" data-status="all">すべて</button>
            <button type="button" class="infoFilterButton" data-status="before">発売前</button>
            <button type="button" class="infoFilterButton" data-status="reservation">予約開始</button>
            <button type="button" class="infoFilterButton" data-status="ongoing">開催中</button>
            <button type="button" class="infoFilterButton" data-status="ended">終了済み</button>
        </div>

        <div class="infoFilterGroup" role="group" aria-label="表示で絞り込み">
            <span class="infoFilterLabel">表示：</span>
            <button type="button" class="infoFilterButton is-active" data-readfilter="all">すべて</button>
            <button type="button" class="infoFilterButton" data-readfilter="unread">未読のみ</button>
        </div>

    </div>

    </div>

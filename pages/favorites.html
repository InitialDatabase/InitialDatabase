<!-- ページ遷移直後のヒーロー画像チラつき対策
     ナビメニュー経由の遷移で復元すべきスクロール位置がsessionStorageにある場合のみ、
     <html>にscrollRestorePendingクラスを付け、本文をCSSで一時的に非表示にする。
     （復元後はjs/common.js側でこのクラスを外す。sessionStorageが使えない環境や
     直接URLを開いた場合・戻る/進むボタンの場合は何もしないため通常通り表示される） -->
<script>
(function(){
    try{
        if(sessionStorage.getItem("initialDDatabaseNavScrollY")){
            document.documentElement.classList.add("scrollRestorePending");
        }
    }catch(error){}
})();
</script>

<main class="container">

<h2>お気に入り一覧</h2>

<div class="infoControls" id="favoriteToolbar">

    <div class="infoControlRow infoSearchRow">
        <input
            type="search"
            id="favoriteSearchInput"
            class="infoSearchInput"
            placeholder="キーワードで検索（例：ポップアップ、AE86）"
            aria-label="お気に入りをキーワードで検索"
            role="combobox"
            aria-expanded="false"
            aria-controls="favoriteSearchSuggestions"
            aria-autocomplete="list"
            autocomplete="off">
        <ul
            id="favoriteSearchSuggestions"
            class="infoSearchSuggestions"
            role="listbox"
            aria-label="検索候補"
            hidden>
        </ul>
    </div>

    <div class="infoFilterGroup" id="favoriteSearchModeToggle" role="group" aria-label="検索方法"></div>

    <button
        type="button"
        id="favoriteFilterToggle"
        class="infoFilterToggle"
        aria-expanded="false"
        aria-controls="favoriteFilterPanel">
        🔍 絞り込み・並び替え <span class="infoFilterToggleIcon" aria-hidden="true">▾</span>
    </button>

    <div class="infoFilterPanel" id="favoriteFilterPanel">

    <div class="infoControlRow infoTagFilters" id="favoriteTagFilters" aria-label="タグで絞り込み">
    </div>

    <div class="infoControlRow infoSubFilters">

        <div class="infoFilterGroup" role="group" aria-label="並び替え">
            <span class="infoFilterLabel">並び替え：</span>
            <button type="button" class="infoFilterButton is-active" data-favsort="added">登録順</button>
            <button type="button" class="infoFilterButton" data-favsort="new">新着順</button>
            <button type="button" class="infoFilterButton" data-favsort="old">古い順</button>
        </div>

        <div class="infoFilterGroup" role="group" aria-label="バックアップ">
            <button type="button" id="favoriteExportButton" class="infoFilterButton">⬇️ エクスポート</button>
            <label class="infoFilterButton favoriteImportLabel">
                ⬆️ インポート
                <input type="file" id="favoriteImportInput" accept="application/json" hidden>
            </label>
            <button type="button" id="favoriteClearAllButton" class="infoFilterButton favoriteClearAllButton">🗑️ 全件削除</button>
        </div>

    </div>

    <div class="infoControlRow">
        <button type="button" id="favoriteFilterClear" class="infoFilterButton" hidden>✕ 絞り込みをクリア</button>
    </div>

    </div>

</div>

<p id="favoriteCount" class="dataCount"></p>

<div id="favoriteList"></div>
